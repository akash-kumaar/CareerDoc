# /etc/nginx/sites-available/jobtrack
# Serves the JobTrack React production build and proxies /api to the
# locally-running Node/Express backend on 127.0.0.1:5000.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/jobtrack;
    index index.html;

    # API requests -> Node/Express (not publicly exposed on its own)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA: serve static files, fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
