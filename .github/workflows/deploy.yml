
name: CareerDoc CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -t careerdoc-backend:ci ./backend

      - name: Build Frontend
        run: docker build -t careerdoc-frontend:ci ./frontend

  deploy:
    name: Deploy to AWS EC2
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CareerDoc deployment from GitHub Actions" \
            --parameters '{"commands":["sudo -u ubuntu git -C /home/ubuntu/careerdoc fetch origin main && sudo -u ubuntu git -C /home/ubuntu/careerdoc reset --hard origin/main && cd /home/ubuntu/careerdoc && sudo docker compose -f compose.yaml -f compose.production.yaml build && sudo docker compose -f compose.yaml -f compose.production.yaml up -d"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
